name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        shell: pwsh
        run: |
          dotnet restore StudioHELPER.sln
          dotnet build StudioHELPER.sln -c Release --no-restore
      - name: Build installer
        shell: pwsh
        run: .\installer\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StudioHELPER-Windows
          path: artifacts/StudioHELPER-Setup.exe
